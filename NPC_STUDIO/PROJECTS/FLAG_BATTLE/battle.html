<script>
'use strict';
(() => {
// ---------------------------------------------------------------- constants
const W = 1080, H = 1920, FPS = 60;
const CX = 540, CY = 950, R = 470;                  // arena
const NB = COUNTRIES.length;
const BR = 46;                                      // ball radius — identical for all
const HP0 = 100, SPEED0 = 640, G = 520;             // identical HP / launch speed for all
const SUBHZ = 240, DT = 1 / SUBHZ;                  // fixed physics step
const GAP = 0.19, GAP_W = 0.42, GAP_START = -Math.PI / 2;   // gap half-angle (rad), spin (rad/s)
const DMG_K = 0.0058, MIN_IMPACT = 70;
const MAX_SIM = 75;
const T_HOOK = 2.2;
const WIN_DUR = 5.4, CTA_DUR = 2.0;
const FONT = '"Inter Display", "Inter", "Arial Black", system-ui, "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", sans-serif';

const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const smooth = v => { v = clamp01(v); return v * v * (3 - 2 * v); };
const wrap = a => { a = (a + Math.PI) % (2 * Math.PI); if (a < 0) a += 2 * Math.PI; return a - Math.PI; };
function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const gapAngle = s => GAP_START + GAP_W * s;

// ---------------------------------------------------------------- simulation
// Runs the whole fight once (deterministic), optionally recording every substep.
function simulate(seed, record) {
  const rng = mulberry32(seed * 2654435761 >>> 0);
  const x = new Float64Array(NB), y = new Float64Array(NB), vx = new Float64Array(NB), vy = new Float64Array(NB);
  const hp = new Float64Array(NB).fill(HP0), alive = new Uint8Array(NB).fill(1);
  // start positions: random, non-overlapping (the only per-ball difference)
  for (let i = 0; i < NB; i++) {
    for (let tries = 0; ; tries++) {
      const a = rng() * Math.PI * 2, d = Math.sqrt(rng()) * (R - BR - 30);
      const px = CX + Math.cos(a) * d, py = CY + Math.sin(a) * d;
      let ok = true;
      for (let j = 0; j < i; j++) if (Math.hypot(px - x[j], py - y[j]) < 2 * BR + 18) { ok = false; break; }
      if (ok || tries > 5000) { x[i] = px; y[i] = py; break; }
    }
    const a = rng() * Math.PI * 2; vx[i] = Math.cos(a) * SPEED0; vy[i] = Math.sin(a) * SPEED0;
  }
  const E0 = 0.5 * SPEED0 * SPEED0 + G * R;           // same mechanical-energy target for everybody
  const maxSteps = MAX_SIM * SUBHZ;
  const rec = record ? { x: new Float32Array((maxSteps + 2) * NB), y: new Float32Array((maxSteps + 2) * NB), hp: new Float32Array((maxSteps + 2) * NB) } : null;
  const hits = [], elims = [], walls = [];
  let nAlive = NB, gapOpen = true, gapCloseS = null, killS = null, endStep = maxSteps, duel = null;
  const eliminate = (i, s, cause, by) => {
    alive[i] = 0; nAlive--;
    elims.push({ s, i, cause, by, x: x[i], y: y[i], vx: vx[i], vy: vy[i] });
    if (nAlive <= 2 && gapOpen) { gapOpen = false; gapCloseS = s; duel = { s, hp: [] }; for (let k = 0; k < NB; k++) if (alive[k]) duel.hp.push([k, hp[k]]); }
    if (nAlive === 1) { killS = s; endStep = Math.min(maxSteps, Math.round(s * SUBHZ) + Math.round(1.6 * SUBHZ)); }
  };
  let step = 0;
  const save = k => { if (!rec) return; for (let i = 0; i < NB; i++) { rec.x[k * NB + i] = x[i]; rec.y[k * NB + i] = y[i]; rec.hp[k * NB + i] = hp[i]; } };
  save(0);
  while (step < endStep) {
    const s = (step + 1) * DT;
    const mult = (1 + Math.max(0, s - 38) * 0.035) * (nAlive <= 2 ? 1.35 : 1);
    for (let i = 0; i < NB; i++) { if (!alive[i]) continue; vy[i] += G * DT; x[i] += vx[i] * DT; y[i] += vy[i] * DT; }
    // ball ↔ ball: elastic equal-mass impulse; the faster ball damages the slower one
    for (let i = 0; i < NB; i++) {
      if (!alive[i]) continue;
      for (let j = i + 1; j < NB; j++) {
        if (!alive[j]) continue;
        const dx = x[j] - x[i], dy = y[j] - y[i], d2 = dx * dx + dy * dy;
        if (d2 >= 4 * BR * BR || d2 < 1e-9) continue;
        const d = Math.sqrt(d2), nx = dx / d, ny = dy / d;
        const rel = (vx[j] - vx[i]) * nx + (vy[j] - vy[i]) * ny;
        const ov = (2 * BR - d) * 0.5;
        x[i] -= nx * ov; y[i] -= ny * ov; x[j] += nx * ov; y[j] += ny * ov;
        if (rel >= 0) continue;
        const si = Math.hypot(vx[i], vy[i]), sj = Math.hypot(vx[j], vy[j]);
        vx[i] += rel * nx; vy[i] += rel * ny; vx[j] -= rel * nx; vy[j] -= rel * ny;
        const impact = -rel;
        if (impact < MIN_IMPACT) continue;
        const atk = si >= sj ? i : j, vic = atk === i ? j : i;
        const dmg = impact * DMG_K * mult;
        hp[vic] = Math.max(0, hp[vic] - dmg);
        hits.push({ s, a: atk, v: vic, impact, dmg, x: (x[i] + x[j]) / 2, y: (y[i] + y[j]) / 2, hpAfter: hp[vic] });
        if (hp[vic] <= 0) eliminate(vic, s, 'hit', atk);
      }
    }
    // walls with a rotating gap
    const ga = gapAngle(s);
    for (let i = 0; i < NB; i++) {
      if (!alive[i]) continue;
      const dx = x[i] - CX, dy = y[i] - CY, d = Math.hypot(dx, dy);
      if (d <= R - BR) continue;
      const inGap = gapOpen && Math.abs(wrap(Math.atan2(dy, dx) - ga)) < GAP;
      if (inGap || (gapOpen && d > R)) {
        for (const sg of [-1, 1]) {                       // gap edges act as round posts
          const ea = ga + sg * GAP, ex = CX + Math.cos(ea) * R, ey = CY + Math.sin(ea) * R;
          const ddx = x[i] - ex, ddy = y[i] - ey, dd = Math.hypot(ddx, ddy);
          if (dd < BR && dd > 1e-6) {
            const nx = ddx / dd, ny = ddy / dd; x[i] = ex + nx * BR; y[i] = ey + ny * BR;
            const vn = vx[i] * nx + vy[i] * ny; if (vn < 0) { vx[i] -= 2 * vn * nx; vy[i] -= 2 * vn * ny; }
          }
        }
        if (Math.hypot(x[i] - CX, y[i] - CY) > R + BR) eliminate(i, s, 'escape', -1);
        continue;
      }
      const nx = dx / d, ny = dy / d;
      x[i] = CX + nx * (R - BR); y[i] = CY + ny * (R - BR);
      const vn = vx[i] * nx + vy[i] * ny;
      if (vn > 0) { vx[i] -= 2 * vn * nx; vy[i] -= 2 * vn * ny; if (vn > 250) walls.push({ s, i, vn }); }
    }
    // identical energy keeper for every ball (offsets numerical loss from position correction)
    for (let i = 0; i < NB; i++) {
      if (!alive[i]) continue;
      const ke = 0.5 * (vx[i] * vx[i] + vy[i] * vy[i]), e = ke + G * (CY + R - y[i]);
      const want = Math.max(ke + (E0 - e) * 0.8 * DT, 2000);
      const k = Math.sqrt(want / Math.max(ke, 1e-6)); vx[i] *= k; vy[i] *= k;
    }
    step++; save(step);
  }
  let winner = -1; for (let i = 0; i < NB; i++) if (alive[i]) winner = i;
  if (killS === null) winner = -1;
  const last = elims[elims.length - 1];
  const winHP = winner >= 0 ? hp[winner] : 0;
  return {
    seed, rec, hits, elims, walls, steps: step, killS, gapCloseS, winner, winHP, duel,
    finalCause: last ? last.cause : null,
    metrics: {
      killS, winner: winner >= 0 ? COUNTRIES[winner][0] : null, winnerHP: +winHP.toFixed(1),
      duelHP: duel ? duel.hp.map(([k, v]) => [COUNTRIES[k][0], +v.toFixed(1)]) : null,
      duelLength: duel && killS ? +(killS - duel.s).toFixed(2) : null,
      escapes: elims.filter(e => e.cause === 'escape').length, kills: elims.filter(e => e.cause === 'hit').length,
      firstElim: elims.length ? +elims[0].s.toFixed(2) : null, finalCause: last ? last.cause : null,
      minElimGap: elims.slice(1).reduce((m, e, k) => Math.min(m, e.s - elims[k].s), 99),
    },
  };
}

// "Good fight" rules used by the seed search.
function verdict(r) {
  const m = r.metrics, why = [];
  if (r.winner < 0) why.push('no winner');
  if (m.finalCause !== 'hit') why.push('final not a collision');
  if (!(m.killS >= 33 && m.killS <= 47)) why.push(`length ${m.killS}`);
  if (!(m.firstElim >= 3)) why.push('first elimination too early');
  if (!m.duelHP || m.duelHP.some(([, v]) => v > 60)) why.push('duel not close');
  if (!(m.winnerHP > 0 && m.winnerHP <= 35)) why.push(`winner HP ${m.winnerHP}`);
  if (!(m.duelLength >= 2.5 && m.duelLength <= 9)) why.push(`duel length ${m.duelLength}`);
  if (m.escapes < 1 || m.kills < 6) why.push('mix of escapes/kills');
  return { ok: !why.length, why };
}
function searchSeed(winnerName, start = 1, count = 6000) {
  const target = COUNTRIES.findIndex(c => c[0].toLowerCase() === String(winnerName).toLowerCase());
  if (target < 0) return { error: `unknown country "${winnerName}". Options: ${COUNTRIES.map(c => c[0]).join(', ')}` };
  let tried = 0, wins = 0;
  for (let seed = start; seed < start + count; seed++) {
    const r = simulate(seed, false); tried++;
    if (r.winner !== target) continue;
    wins++;
    if (verdict(r).ok) return { seed, tried, wins, metrics: r.metrics };
  }
  return { error: `no qualifying seed for ${winnerName} in ${count} tries (${wins} wins found)` };
}

// ---------------------------------------------------------------- timeline (video frame → sim time)
let S = null;          // current simulation result
let frameSim, nEnd, TOTAL, hitFrames, elimFrames, banners, winnerFrame, slowStartFrame;
function buildTimeline() {
  const K = S.killS;
  const speed = s => {
    const down = smooth((s - (K - 1.25)) / 0.5), up = smooth((s - (K + 0.22)) / 0.45);
    return 1 - 0.82 * down + 0.82 * up * down;
  };
  const arr = [0]; let s = 0;
  while (s < K + 0.95) { s += speed(s) / FPS; arr.push(s); }
  frameSim = Float64Array.from(arr); nEnd = arr.length - 1;
  TOTAL = nEnd + Math.round(WIN_DUR * FPS);
  winnerFrame = nEnd;
  slowStartFrame = toFrame(K - 1.25);
  hitFrames = S.hits.map(h => toFrame(h.s));
  elimFrames = S.elims.map(e => toFrame(e.s));
  // banners: eliminations + "final duel"; never overlapping
  const items = S.elims.map((e, k) => ({ f: elimFrames[k], text: `❌ ${COUNTRIES[e.i][0].toUpperCase()} ELIMINATED`, kind: e.cause, i: e.i }));

  ctx.drawImage(bgCanvas, 0, 0);
  ctx.save(); ctx.beginPath(); ctx.arc(bx + (CX - bx) * p, by + (H / 2 - by) * p, rad, 0, Math.PI * 2); ctx.clip();
  const zoom = 1.12 - 0.12 * smooth(t / 3);
  ctx.translate(W / 2, H / 2); ctx.scale(zoom, zoom); ctx.translate(-W / 2, -H / 2);
  ctx.drawImage(getBigFlag(wi), 0, 0); ctx.restore();
  const shade = ctx.createLinearGradient(0, 0, 0, H);
  shade.addColorStop(0, 'rgba(0,0,0,0.25)'); shade.addColorStop(0.45, 'rgba(0,0,0,0.05)'); shade.addColorStop(1, 'rgba(0,0,0,0.65)');
  ctx.globalAlpha = p; ctx.fillStyle = shade; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
  // confetti
  const cols = [...flagColors[wi], '#ffd34d', '#ffffff'];
  for (const c of CONF) {
    const tt = t - 0.25; if (tt < 0) break;
    const py = c.y + c.vy * tt; if (py < -40 || py > H + 40) continue;
    const px = c.x + Math.sin(tt * c.w + c.ph) * c.amp;
    ctx.save(); ctx.translate(px, py); ctx.rotate(c.rot + c.vr * tt); ctx.scale(Math.cos(tt * 6 + c.ph), 1);
    ctx.fillStyle = c.gold ? '#ffd34d' : cols[c.ci % cols.length]; ctx.fillRect(-c.sz / 2, -c.sz / 4, c.sz, c.sz / 2); ctx.restore();
  }
  // title
  if (t > 0.35) {
    const q = clamp01((t - 0.35) / 0.4), back = 1 + 2.7 * Math.pow(q - 1, 3) + 1.7 * Math.pow(q - 1, 2);
    ctx.save(); ctx.globalAlpha = clamp01(q * 2); ctx.translate(CX, 760); ctx.scale(back, back);
    text(`🏆 ${name} WINS`, 0, 0, 118, { maxW: 1000, glow: 'rgba(255,210,80,0.9)', blur: 40, stroke: 20 });
    ctx.restore();
  }
  if (t > 0.9) {
    const q = clamp01((t - 0.9) / 0.4);
    ctx.globalAlpha = q; text(`Survived with ${Math.max(1, Math.round(S.winHP))} HP`, CX, 880, 52, { stroke: 10 }); ctx.globalAlpha = 1;
  }
  // last 2 seconds: call to action
  const tc = t - (WIN_DUR - CTA_DUR);
  if (tc >= 0) {
    const q = smooth(tc / 0.3), pulse = 1 + 0.04 * Math.sin(tc * 8);
    ctx.save(); ctx.globalAlpha = q; ctx.translate(CX, 1230 + (1 - q) * 60); ctx.scale(pulse, pulse);
    roundRect(-470, -80, 940, 160, 40); ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fill();
    text('Comment the next country ⬇️', 0, 2, 62, { maxW: 880, stroke: 10 });
    ctx.restore();
  }
  // flash at the cut
  if (t < 0.25) { ctx.globalAlpha = 0.9 * (1 - t / 0.25); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}

// ---------------------------------------------------------------- public API
async function ready(seed) {
  try { await Promise.all([document.fonts.load(`900 48px "Inter Display"`), document.fonts.load(`48px "Noto Color Emoji"`)]); } catch (e) {}
  if (!ballSprite.length) { makeBackground(); await loadFlags(); }
  S = simulate(seed, true);
  if (S.winner < 0) throw new Error(`seed ${seed}: no winner within ${MAX_SIM}s`);
  buildTimeline();
  SHARDS = S.elims.map((e, k) => shardsFor(k));
  CHIPS = S.elims.map((e, k) => { const r = mulberry32(5000 + k); return Array.from({ length: 34 }, () => {
    const a = r() * 6.28, sp = 120 + r() * 520; return { vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 180, s: 4 + r() * 7, col: flagColors[e.i][(r() * flagColors[e.i].length) | 0] }; }); });
  return info();
}
function info() { return { seed: S.seed, totalFrames: TOTAL, seconds: TOTAL / FPS, verdict: verdict(S), metrics: S.metrics }; }
function renderFrame(n) { n = Math.max(0, Math.min(TOTAL - 1, n | 0)); draw(n); return n; }
function getEvents() {
  return {
    fps: FPS, totalFrames: TOTAL, seed: S.seed, countries: COUNTRIES.map(c => c[0]), winner: COUNTRIES[S.winner][0],
    hits: S.hits.map((h, k) => {
      const f = hitFrames[k]; stateAt(frameSim[f], ST);
      return { frame: f, simS: +h.s.toFixed(5), impact: +h.impact.toFixed(1), attacker: COUNTRIES[h.a][0], victim: COUNTRIES[h.v][0],
               x: Math.round(h.x), contactGap: +(Math.hypot(ST.x[h.a] - ST.x[h.v], ST.y[h.a] - ST.y[h.v]) - 2 * BR).toFixed(2) };
    }),
    elims: S.elims.map((e, k) => ({ frame: elimFrames[k], country: COUNTRIES[e.i][0], cause: e.cause, by: e.by >= 0 ? COUNTRIES[e.by][0] : null,
      shatterFrame: e.cause === 'escape' ? toFrame(e.s + 0.45) : elimFrames[k], x: Math.round(e.x) })),
    walls: S.walls.map(w => ({ frame: toFrame(w.s), vn: Math.round(w.vn) })),
    gapCloseFrame: S.gapCloseS !== null ? toFrame(S.gapCloseS) : null, slowStartFrame, killFrame: elimFrames[elimFrames.length - 1],
    winnerFrame, ctaFrame: winnerFrame + Math.round((WIN_DUR - CTA_DUR) * FPS),
    banners: banners.map(b => ({ text: b.text, from: b.f, to: b.end })),
    layout: { hook: [130, 330], counter: [357, 433], bannerZone: [153, 257], arena: [CY - R - 30, CY + R + 30], leaderboard: [1465, 1631] },
    metrics: S.metrics, verdict: verdict(S),
  };
}
Object.assign(window, { ready, renderFrame, getEvents, searchSeed, simulate: (s) => simulate(s, false).metrics, info });

// ---------------------------------------------------------------- live preview
if (/[?&]render\b/.test(location.search)) { document.body.classList.add('render'); return; }
const qs = new URLSearchParams(location.search), hud = document.getElementById('hud'), startEl = document.getElementById('start');
let playing = false, t0 = 0, cur = 0, ac = null, lastAudio = -1;
function boot(seed) {
  return ready(seed).then(inf => { hud.textContent = `seed ${inf.seed} · ${inf.seconds.toFixed(1)}s · ${inf.verdict.ok ? 'good fight' : inf.verdict.why.join(', ')}`; renderFrame(0); cur = 0; t0 = performance.now(); lastAudio = -1; });
}
function beep(f, dur, amp, type = 'sine', when = 0) {
  if (!ac) return; const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(Math.max(30, f * 0.4), t + dur);
  g.gain.setValueAtTime(amp, t); g.gain.exponentialRampToValueAtTime(1e-4, t + dur); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
}
function previewAudio(n) {
  for (let k = lb(hitFrames, lastAudio + 1); k < hitFrames.length && hitFrames[k] <= n; k++) beep(160, 0.12, Math.min(0.5, S.hits[k].impact / 2500), 'triangle');
  for (let k = 0; k < elimFrames.length; k++) if (elimFrames[k] > lastAudio && elimFrames[k] <= n) { beep(1800, 0.4, 0.15, 'square'); beep(2600, 0.5, 0.1); }
  if (winnerFrame > lastAudio && winnerFrame <= n) [261.6, 329.6, 392, 523.3].forEach(f => beep(f, 1.8, 0.12, 'sawtooth'));
  const beat = 60 / 128;
  for (let f = lastAudio + 1; f <= n; f++) { const b = f / FPS / beat; if (Math.floor(b) !== Math.floor((f - 1) / FPS / beat)) beep(110, 0.18, 0.35); }
  lastAudio = n;
}
function tick() {
  if (playing) {
    let n = Math.floor((performance.now() - t0) / 1000 * FPS);
    if (n >= TOTAL + 60) { t0 = performance.now(); n = 0; lastAudio = -1; }
    cur = Math.min(n, TOTAL - 1); renderFrame(cur); previewAudio(cur);
  }
  requestAnimationFrame(tick);
}
const seekTo = n => { cur = Math.max(0, Math.min(TOTAL - 1, n)); t0 = performance.now() - cur / FPS * 1000; lastAudio = cur; renderFrame(cur); };
startEl.onclick = () => { startEl.remove(); try { ac = new AudioContext(); } catch (e) {} t0 = performance.now(); playing = true; };
addEventListener('keydown', e => {
  if (e.code === 'Space') { playing = !playing; if (playing) seekTo(cur); }
  if (e.code === 'KeyR') seekTo(0);
  if (e.code === 'ArrowRight') seekTo(cur + 5 * FPS);
  if (e.code === 'ArrowLeft') seekTo(cur - 5 * FPS);
  if (e.code === 'KeyN') { const name = COUNTRIES[(Math.random() * NB) | 0][0], r = searchSeed(name, 1 + ((Math.random() * 50000) | 0), 4000); if (r.seed) boot(r.seed); }
});
let seed = +qs.get('seed') || DEFAULT_SEED;
if (qs.get('winner')) { const r = searchSeed(qs.get('winner')); if (r.seed) seed = r.seed; else hud.textContent = r.error; }
boot(seed).then(() => requestAnimationFrame(tick));
})();
</script>
